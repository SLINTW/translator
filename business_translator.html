<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarPilot — 商務即時翻譯</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --danger: #ef4444;
    --text: #f0f0f8;
    --text2: #8888aa;
    --text3: #4444660;
    --glow: 0 0 30px rgba(0,229,255,0.15);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--accent); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text2);
    transition: all 0.3s;
  }
  .status-dot.active { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }
  .status-dot.listening { background: var(--danger); box-shadow: 0 0 12px var(--danger); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Mode Toggle */
  .mode-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.3;
  }

  .mode-btn.active {
    background: var(--accent2);
    color: white;
    box-shadow: 0 0 16px rgba(124,58,237,0.4);
  }

  .mode-label {
    font-size: 9px;
    opacity: 0.7;
    display: block;
    margin-top: 2px;
  }

  /* Language Selector */
  .lang-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .lang-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .lang-btn {
    padding: 10px 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .lang-btn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,255,0.08);
    box-shadow: 0 0 12px rgba(0,229,255,0.1);
  }

  .lang-flag { font-size: 18px; display: block; margin-bottom: 4px; }

  /* Business Context */
  .context-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .context-textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 12px;
    resize: none;
    height: 80px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }

  .context-textarea:focus { border-color: var(--accent2); }
  .context-textarea::placeholder { color: var(--text2); }

  /* Main Mic Button */
  .mic-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0;
  }

  .mic-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 16px;
  }

  .mic-ring::before, .mic-ring::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.2);
    transition: all 0.3s;
  }

  .mic-ring::after {
    inset: -16px;
    border-color: rgba(0,229,255,0.1);
  }

  .mic-ring.active::before {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
    animation: ring-pulse 1.5s infinite;
  }

  .mic-ring.active::after {
    border-color: rgba(0,229,255,0.3);
    animation: ring-pulse 1.5s infinite 0.3s;
  }

  @keyframes ring-pulse {
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.05); opacity:0.6; }
  }

  .mic-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--surface2), var(--surface));
    border: 2px solid var(--border);
    color: var(--text2);
    font-size: 40px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }

  .mic-btn.recording {
    background: linear-gradient(135deg, #1a0505, #0d0d1a);
    border-color: var(--danger);
    color: var(--danger);
    box-shadow: 0 0 30px rgba(239,68,68,0.3);
  }

  .mic-status {
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Transcript Display */
  .transcript-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    min-height: 80px;
  }

  .transcript-heard {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 12px;
    line-height: 1.6;
    min-height: 20px;
  }

  .transcript-heard.has-text { color: var(--text); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 12px 0;
  }

  /* Reply Box */
  .reply-box {
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    min-height: 60px;
    position: relative;
  }

  .reply-label {
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .reply-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    font-family: 'Syne', sans-serif;
    font-weight: 400;
  }

  .reply-zh {
    font-size: 11px;
    color: var(--text2);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    line-height: 1.6;
  }

  /* Speak button */
  .speak-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent2), #4f46e5);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .speak-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .speak-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .speak-btn.speaking {
    background: linear-gradient(135deg, var(--accent3), #059669);
    animation: speak-glow 1s infinite;
  }

  @keyframes speak-glow {
    0%,100%{ box-shadow: 0 0 0 rgba(16,185,129,0); }
    50%{ box-shadow: 0 0 20px rgba(16,185,129,0.4); }
  }

  /* Speed control */
  .speed-section {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .speed-label { font-size: 11px; color: var(--text2); white-space: nowrap; }

  .speed-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  .speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .speed-val { font-size: 11px; color: var(--accent); min-width: 30px; text-align: right; }

  /* Loading spinner */
  .loading {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 13px;
    color: var(--text);
    transition: transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--accent3); color: var(--accent3); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">Ear<span>Pilot</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="statusText" style="font-size:11px;color:var(--text2)">待機中</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </div>

  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeAuto" onclick="setMode('auto')">
      🤖 全自動模式
      <span class="mode-label">AI 直接幫你說</span>
    </button>
    <button class="mode-btn" id="modeSuggest" onclick="setMode('suggest')">
      💡 提詞模式
      <span class="mode-label">你自己決定說什麼</span>
    </button>
  </div>

  <!-- Language Selection -->
  <div class="lang-section">
    <div class="section-label">對方語言</div>
    <div class="lang-grid">
      <button class="lang-btn selected" onclick="selectLang(this,'en-US','英語')">
        <span class="lang-flag">🇺🇸</span>英語
      </button>
      <button class="lang-btn" onclick="selectLang(this,'ja-JP','日語')">
        <span class="lang-flag">🇯🇵</span>日語
      </button>
      <button class="lang-btn" onclick="selectLang(this,'ko-KR','韓語')">
        <span class="lang-flag">🇰🇷</span>韓語
      </button>
      <button class="lang-btn" onclick="selectLang(this,'fr-FR','法語')">
        <span class="lang-flag">🇫🇷</span>法語
      </button>
      <button class="lang-btn" onclick="selectLang(this,'ar-SA','阿拉伯語')">
        <span class="lang-flag">🇸🇦</span>阿拉伯語
      </button>
      <button class="lang-btn" onclick="selectLang(this,'de-DE','德語')">
        <span class="lang-flag">🇩🇪</span>德語
      </button>
    </div>
  </div>

  <!-- Business Context -->
  <div class="context-section">
    <div class="section-label">商業背景設定</div>
    <textarea class="context-textarea" id="businessContext">我是 PRAUS 柏爾舒的創辦人，正在進行品牌推廣與業務介紹。PRAUS 柏爾舒的核心價值是積極正向、以人為本，我是一位具有責任心的創業者。回覆風格需展現自信、溫暖、專業，讓對方感受到品牌的人文精神與創辦人的真誠態度。</textarea>
  </div>

  <!-- Speed Control -->
  <div class="speed-section">
    <span class="speed-label">🔊 耳機播速</span>
    <input type="range" class="speed-slider" id="speedSlider" min="0.6" max="1.4" step="0.1" value="0.9" oninput="updateSpeed(this.value)">
    <span class="speed-val" id="speedVal">0.9x</span>
  </div>

  <!-- Mic Button -->
  <div class="mic-section">
    <div class="mic-ring" id="micRing">
      <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤</button>
    </div>
    <div class="mic-status" id="micStatus">點擊開始聆聽</div>
  </div>

  <!-- Transcript -->
  <div class="transcript-section">
    <div class="section-label">對方說的話</div>
    <div class="transcript-heard" id="transcriptText">等待收音...</div>
  </div>

  <!-- Reply -->
  <div class="reply-box" id="replyBox">
    <div class="reply-label" id="replyLabel">建議回覆</div>
    <div class="reply-text" id="replyText">尚無回覆內容</div>
    <div class="reply-zh" id="replyZh"></div>
  </div>

  <!-- Speak Button -->
  <button class="speak-btn" id="speakBtn" onclick="speakReply()" disabled>
    🎧 用耳機播放回覆
  </button>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const GEMINI_API_KEY = 'AIzaSyCO9NpUA52ky5y3pqhNlWuRa8zClm58SMA';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

let currentLang = 'en-US';
let currentLangName = '英語';
let currentMode = 'auto';
let recognition = null;
let isListening = false;
let currentReplyText = '';
let speechSpeed = 0.9;
let isSpeaking = false;

// ── Language ──
function selectLang(btn, code, name) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  currentLang = code;
  currentLangName = name;
  showToast(`已切換：${name}`, 'success');
}

// ── Mode ──
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeAuto').classList.toggle('active', mode === 'auto');
  document.getElementById('modeSuggest').classList.toggle('active', mode === 'suggest');
  document.getElementById('replyLabel').textContent = mode === 'auto' ? '跟著說（AI 已幫你準備好）' : '建議回覆';
}

// ── Speed ──
function updateSpeed(val) {
  speechSpeed = parseFloat(val);
  document.getElementById('speedVal').textContent = val + 'x';
}

// ── Mic / Speech Recognition ──
function toggleListening() {
  if (isListening) stopListening();
  else startListening();
}

function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('此瀏覽器不支援語音辨識，請用 Chrome', 'error');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = currentLang;
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    setListeningUI(true);
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    const display = final || interim;
    if (display) {
      const el = document.getElementById('transcriptText');
      el.textContent = display;
      el.classList.add('has-text');
    }
    if (final.trim()) {
      stopListening();
      generateReply(final.trim());
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') showToast('辨識錯誤：' + e.error, 'error');
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) recognition.start(); // keep alive
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  if (recognition) { recognition.onend = null; recognition.stop(); }
  setListeningUI(false);
}

function setListeningUI(on) {
  const btn = document.getElementById('micBtn');
  const ring = document.getElementById('micRing');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const micStatus = document.getElementById('micStatus');

  btn.classList.toggle('recording', on);
  ring.classList.toggle('active', on);
  dot.className = 'status-dot' + (on ? ' listening' : ' active');
  statusText.textContent = on ? '聆聽中' : '待機中';
  micStatus.textContent = on ? '正在聆聽對方說話...' : '點擊開始聆聽';
  btn.textContent = on ? '⏹' : '🎤';
}

// ── Gemini API ──
async function generateReply(heardText) {
  const context = document.getElementById('businessContext').value.trim();
  const replyText = document.getElementById('replyText');
  const replyZh = document.getElementById('replyZh');
  const speakBtn = document.getElementById('speakBtn');

  replyText.innerHTML = '<span class="loading"></span>AI 思考中...';
  replyZh.textContent = '';
  speakBtn.disabled = true;

  const systemPrompt = `你是 PRAUS 柏爾舒創辦人的專屬即時商務口語助理。

品牌背景：PRAUS 柏爾舒是一個以人為本、積極正向的品牌，創辦人正在進行品牌推廣與業務介紹。
${context ? `補充：${context}` : ''}

任務：
1. 對方剛說了一段${currentLangName}
2. 代表創辦人生成自然、流暢、專業的${currentLangName}口語回覆
3. 語氣：自信但不傲慢、溫暖有親和力、展現品牌人文精神
4. 長度適合口語（2-4句），讓人聽完就能跟著說
5. 同時提供中文說明

只輸出以下 JSON（不要任何其他文字或 markdown）：
{
  "reply_foreign": "自然口語的${currentLangName}回覆",
  "reply_zh": "【對方說】摘要 ＋ 【回覆意思】中文說明"
}`;

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${systemPrompt}\n\n對方說：${heardText}` }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
      })
    });

    const data = await res.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    currentReplyText = parsed.reply_foreign;
    replyText.textContent = parsed.reply_foreign;
    replyZh.textContent = '📋 ' + parsed.reply_zh;
    speakBtn.disabled = false;

    // Auto mode: speak immediately
    if (currentMode === 'auto') {
      setTimeout(() => speakReply(), 300);
    }

  } catch (err) {
    replyText.textContent = '生成失敗，請再試一次';
    showToast('API 錯誤，請檢查網路', 'error');
  }
}

// ── TTS ──
function speakReply() {
  if (!currentReplyText || isSpeaking) return;

  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(currentReplyText);
  utt.lang = currentLang;
  utt.rate = speechSpeed;
  utt.pitch = 1.0;

  const speakBtn = document.getElementById('speakBtn');

  utt.onstart = () => {
    isSpeaking = true;
    speakBtn.classList.add('speaking');
    speakBtn.textContent = '🔊 播放中，跟著說...';
    document.getElementById('statusDot').className = 'status-dot active';
    document.getElementById('statusText').textContent = '播放中';
  };

  utt.onend = () => {
    isSpeaking = false;
    speakBtn.classList.remove('speaking');
    speakBtn.textContent = '🎧 用耳機播放回覆';
    document.getElementById('statusText').textContent = '待機中';
  };

  window.speechSynthesis.speak(utt);
}

// ── Toast ──
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

// Init
document.getElementById('statusDot').className = 'status-dot active';
</script>
</body>
</html>
