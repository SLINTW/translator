<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EarPilot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#0d0d14; color:#f0f0f8; font-family:system-ui,sans-serif; min-height:100vh; padding:16px 16px 40px; }

h1 { text-align:center; font-size:20px; padding:16px 0 4px; color:#00e5ff; letter-spacing:1px; }
.sub { text-align:center; font-size:11px; color:#555; margin-bottom:16px; }

.card { background:#1a1a24; border:1px solid #2a2a3a; border-radius:14px; padding:14px; margin-bottom:12px; }
.lbl { font-size:10px; color:#00e5ff; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }

.lang-row { display:flex; gap:6px; flex-wrap:wrap; }
.lang-btn { padding:7px 11px; border:1px solid #2a2a3a; border-radius:8px; background:#0d0d14; color:#888; font-size:12px; cursor:pointer; transition:all 0.2s; }
.lang-btn.on { border-color:#00e5ff; color:#00e5ff; background:rgba(0,229,255,0.08); }

textarea { width:100%; background:#0d0d14; border:1px solid #2a2a3a; border-radius:8px; color:#f0f0f8; font-size:12px; padding:10px; resize:none; height:60px; outline:none; font-family:system-ui,sans-serif; }

.mode-row { display:flex; gap:8px; }
.mode-btn { flex:1; padding:10px 6px; border:1px solid #2a2a3a; border-radius:8px; background:#0d0d14; color:#888; font-size:11px; cursor:pointer; text-align:center; line-height:1.4; transition:all 0.2s; }
.mode-btn.on { border-color:#7c3aed; color:#c4b5fd; background:rgba(124,58,237,0.1); }

/* MIC */
.mic-wrap { display:flex; flex-direction:column; align-items:center; padding:16px 0 8px; }
#micBtn { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,#1a1a2e,#16213e); border:3px solid #2a2a3a; color:#888; font-size:44px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; user-select:none; -webkit-user-select:none; }
#micBtn.active { border-color:#ef4444; color:#ef4444; box-shadow:0 0 30px rgba(239,68,68,0.35); }
#micBtn.thinking { border-color:#f59e0b; color:#f59e0b; }
#micLabel { margin-top:10px; font-size:12px; color:#666; }

#statusBar { font-size:11px; color:#f59e0b; min-height:18px; text-align:center; padding:4px 0 8px; }

/* HEARD */
.heard-txt { font-size:14px; color:#aaa; line-height:1.6; min-height:40px; }
.heard-txt.has { color:#f0f0f8; }

/* REPLY SENTENCES */
.sentences-wrap { display:flex; flex-direction:column; gap:8px; }
.sent-item { padding:10px 12px; border-radius:10px; border:1px solid #2a2a3a; background:#0d0d14; transition:all 0.3s; }
.sent-item.current { border-color:#00e5ff; background:rgba(0,229,255,0.07); }
.sent-item.done { border-color:#10b981; background:rgba(16,185,129,0.06); opacity:0.6; }
.sent-item.pending { opacity:0.4; }
.sent-en { font-size:14px; color:#f0f0f8; line-height:1.6; }
.sent-zh { font-size:11px; color:#666; margin-top:4px; }
.sent-status { font-size:11px; margin-top:4px; }
.sent-status.match { color:#10b981; }
.sent-status.nomatch { color:#ef4444; }

/* MATCH BAR */
.match-bar-wrap { margin-top:6px; background:#1a1a24; border-radius:4px; height:6px; overflow:hidden; }
.match-bar { height:100%; background:#00e5ff; border-radius:4px; transition:width 0.3s; width:0%; }
.match-bar.good { background:#10b981; }

/* SPEAK BTN */
#speakBtn { width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:white; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:12px; transition:all 0.2s; }
#speakBtn:disabled { opacity:0.3; cursor:not-allowed; }
#speakBtn.speaking { background:linear-gradient(135deg,#10b981,#059669); }

.speed-row { display:flex; align-items:center; gap:10px; }
.speed-row label { font-size:11px; color:#666; white-space:nowrap; }
input[type=range] { flex:1; accent-color:#00e5ff; }
#speedVal { font-size:11px; color:#00e5ff; min-width:32px; }

.threshold-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
.threshold-row label { font-size:11px; color:#666; white-space:nowrap; }
#threshVal { font-size:11px; color:#f59e0b; min-width:32px; }
</style>
</head>
<body>

<h1>🎧 EarPilot</h1>
<p class="sub">PRAUS 柏爾舒 · 智能提詞系統</p>

<!-- 模式 -->
<div class="card">
  <div class="lbl">回覆模式</div>
  <div class="mode-row">
    <button class="mode-btn on" id="modeAuto" onclick="setMode('auto')">🤖 全自動<br><small>自動播＋偵測跟讀</small></button>
    <button class="mode-btn" id="modeSuggest" onclick="setMode('suggest')">💡 手動<br><small>自己決定播放</small></button>
  </div>
</div>

<!-- 語言 -->
<div class="card">
  <div class="lbl">對方語言</div>
  <div class="lang-row">
    <button class="lang-btn on" onclick="setLang(this,'en-US','英語')">🇺🇸 英語</button>
    <button class="lang-btn" onclick="setLang(this,'ja-JP','日語')">🇯🇵 日語</button>
    <button class="lang-btn" onclick="setLang(this,'ko-KR','韓語')">🇰🇷 韓語</button>
    <button class="lang-btn" onclick="setLang(this,'fr-FR','法語')">🇫🇷 法語</button>
    <button class="lang-btn" onclick="setLang(this,'ar-SA','阿拉伯語')">🇸🇦 阿拉伯語</button>
    <button class="lang-btn" onclick="setLang(this,'de-DE','德語')">🇩🇪 德語</button>
  </div>
</div>

<!-- 背景 -->
<div class="card">
  <div class="lbl">商業背景</div>
  <textarea id="ctx">我是 PRAUS 柏爾舒的創辦人，正在進行品牌推廣與業務介紹。核心價值是積極正向、以人為本。回覆需自信、溫暖、專業。</textarea>
</div>

<!-- 速度 & 門檻 -->
<div class="card">
  <div class="speed-row">
    <label>🔊 播速</label>
    <input type="range" min="0.5" max="1.5" step="0.05" value="0.85" oninput="spd=parseFloat(this.value);document.getElementById('speedVal').textContent=this.value+'x'">
    <span id="speedVal">0.85x</span>
  </div>
  <div class="threshold-row">
    <label>🎯 跟讀門檻</label>
    <input type="range" min="50" max="95" step="5" value="80" oninput="threshold=parseInt(this.value);document.getElementById('threshVal').textContent=this.value+'%'">
    <span id="threshVal">80%</span>
  </div>
</div>

<!-- MIC -->
<div class="mic-wrap">
  <button id="micBtn"
    ontouchstart="startRec(event)" ontouchend="stopRec(event)"
    onmousedown="startRec(event)" onmouseup="stopRec(event)">🎤</button>
  <div id="micLabel">按住收聽對方</div>
</div>

<div id="statusBar">✅ 準備好了</div>

<!-- 對方說 -->
<div class="card">
  <div class="lbl">對方說的話</div>
  <div class="heard-txt" id="heard">等待收音...</div>
</div>

<!-- 回覆句子列表 -->
<div class="card" id="replyCard" style="display:none">
  <div class="lbl">你的回覆 <span id="progressTxt" style="color:#f59e0b"></span></div>
  <div class="sentences-wrap" id="sentList"></div>
</div>

<!-- 播放按鈕 -->
<button id="speakBtn" disabled onclick="startReading()">🎧 開始播放回覆</button>

<script>
const GROQ_KEY = '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';
const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';

let lang = 'en-US', langName = '英語', mode = 'auto';
let spd = 0.85, threshold = 80;
let rec = null, isRec = false;
let sentences = [], currentIdx = 0, isReading = false;
let verifyRec = null;

function log(msg, col) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.style.color = col || '#f59e0b';
}

function setLang(btn, code, name) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  lang = code; langName = name;
  log('語言切換：' + name, '#00e5ff');
}

function setMode(m) {
  mode = m;
  document.getElementById('modeAuto').classList.toggle('on', m==='auto');
  document.getElementById('modeSuggest').classList.toggle('on', m==='suggest');
}

// ── 收音對方說話 ──
function startRec(e) {
  e.preventDefault();
  if (isRec || isReading) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { log('請用Chrome瀏覽器', '#ef4444'); return; }
  rec = new SR();
  rec.lang = lang;
  rec.continuous = false;
  rec.interimResults = true;
  rec.onstart = () => {
    isRec = true;
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('micLabel').textContent = '聆聽中...';
    log('🔴 收音中，放開送出', '#ef4444');
  };
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    const el = document.getElementById('heard');
    el.textContent = txt; el.classList.add('has');
  };
  rec.onerror = (e) => { log('收音錯誤：'+e.error,'#ef4444'); resetMic(); };
  rec.onend = () => {
    const txt = document.getElementById('heard').textContent;
    resetMic();
    if (txt && txt !== '等待收音...') callAI(txt);
  };
  try { rec.start(); } catch(e) { log('無法啟動：'+e.message,'#ef4444'); }
}

function stopRec(e) {
  e.preventDefault();
  if (rec && isRec) { try { rec.stop(); } catch(e){} }
}

function resetMic() {
  isRec = false;
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('micLabel').textContent = '按住收聽對方';
}

// ── AI 生成回覆 ──
async function callAI(heard) {
  document.getElementById('micBtn').classList.add('thinking');
  document.getElementById('micLabel').textContent = 'AI 思考中...';
  log('⏳ 生成回覆中...', '#f59e0b');
  document.getElementById('speakBtn').disabled = true;
  document.getElementById('replyCard').style.display = 'none';

  const ctx = document.getElementById('ctx').value;
  const prompt = `你是 PRAUS 柏爾舒創辦人的即時商務口語助理。
背景：${ctx}
對方說了一段${langName}，請代表創辦人生成自然、專業、溫暖的${langName}口語回覆。
重要：把回覆分成3到5個短句，每句適合單獨朗讀（10到20字）。
只輸出JSON陣列，不要其他文字：
[
  {"en":"第一句${langName}","zh":"中文意思"},
  {"en":"第二句${langName}","zh":"中文意思"}
]`;

  try {
    const res = await fetch(GROQ_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+GROQ_KEY },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role:'user', content: prompt+'\n\n對方說：'+heard }],
        temperature: 0.7, max_tokens: 500
      })
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const raw = data.choices?.[0]?.message?.content || '';
    const clean = raw.replace(/```json|```
