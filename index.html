<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EarPilot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#0d0d14; color:#f0f0f8; font-family:system-ui,sans-serif; min-height:100vh; padding:16px 16px 40px; }
h1 { text-align:center; font-size:20px; padding:16px 0 4px; color:#00e5ff; }
.sub { text-align:center; font-size:11px; color:#555; margin-bottom:16px; }
.card { background:#1a1a24; border:1px solid #2a2a3a; border-radius:14px; padding:14px; margin-bottom:12px; }
.lbl { font-size:10px; color:#00e5ff; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
.lang-row { display:flex; gap:6px; flex-wrap:wrap; }
.lang-btn { padding:7px 11px; border:1px solid #2a2a3a; border-radius:8px; background:#0d0d14; color:#888; font-size:12px; cursor:pointer; transition:all 0.2s; }
.lang-btn.on { border-color:#00e5ff; color:#00e5ff; background:rgba(0,229,255,0.08); }
textarea { width:100%; background:#0d0d14; border:1px solid #2a2a3a; border-radius:8px; color:#f0f0f8; font-size:12px; padding:10px; resize:none; height:60px; outline:none; font-family:system-ui,sans-serif; }

/* MIC */
.mic-wrap { display:flex; flex-direction:column; align-items:center; padding:16px 0 8px; }
#micBtn { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,#1a1a2e,#16213e); border:3px solid #2a2a3a; color:#888; font-size:44px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; user-select:none; -webkit-user-select:none; }
#micBtn.active { border-color:#ef4444; color:#ef4444; box-shadow:0 0 30px rgba(239,68,68,0.35); }
#micBtn.thinking { border-color:#f59e0b; color:#f59e0b; }
#micBtn.verify { border-color:#00e5ff; color:#00e5ff; box-shadow:0 0 20px rgba(0,229,255,0.3); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
#micLabel { margin-top:10px; font-size:12px; color:#666; text-align:center; }

#statusBar { font-size:12px; min-height:20px; text-align:center; padding:4px 0 8px; color:#f59e0b; }

/* SENTENCES */
.sent-item { padding:12px; border-radius:10px; border:1px solid #2a2a3a; background:#0d0d14; margin-bottom:8px; transition:all 0.3s; }
.sent-item.current { border-color:#00e5ff; background:rgba(0,229,255,0.07); }
.sent-item.done { border-color:#10b981; background:rgba(16,185,129,0.06); opacity:0.5; }
.sent-item.pending { opacity:0.35; }
.sent-en { font-size:15px; color:#f0f0f8; line-height:1.6; }
.sent-zh { font-size:11px; color:#666; margin-top:3px; }
.sent-result { font-size:11px; margin-top:5px; }
.sent-result.ok { color:#10b981; }
.sent-result.fail { color:#ef4444; }
.bar-wrap { margin-top:6px; background:#2a2a3a; border-radius:4px; height:5px; }
.bar { height:100%; border-radius:4px; transition:width 0.4s; width:0; background:#00e5ff; }
.bar.good { background:#10b981; }

/* BUTTONS */
.btn-row { display:flex; gap:8px; margin-bottom:12px; }
.btn { flex:1; padding:14px; border:none; border-radius:12px; color:white; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; }
.btn:disabled { opacity:0.3; cursor:not-allowed; }
.btn-start { background:linear-gradient(135deg,#7c3aed,#4f46e5); }
.btn-stop { background:linear-gradient(135deg,#ef4444,#dc2626); }
.btn-skip { background:linear-gradient(135deg,#374151,#1f2937); border:1px solid #4b5563; }

.speed-row { display:flex; align-items:center; gap:10px; }
.speed-row label { font-size:11px; color:#666; white-space:nowrap; }
input[type=range] { flex:1; accent-color:#00e5ff; }
#speedVal { font-size:11px; color:#00e5ff; min-width:32px; }
.thresh-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
.thresh-row label { font-size:11px; color:#666; white-space:nowrap; }
#threshVal { font-size:11px; color:#f59e0b; min-width:32px; }

.heard-txt { font-size:14px; color:#aaa; line-height:1.6; min-height:36px; }
.heard-txt.has { color:#f0f0f8; }

#replyCard { display:none; }
#progressTxt { color:#f59e0b; font-size:11px; }
</style>
</head>
<body>

<h1>🎧 EarPilot</h1>
<p class="sub">PRAUS 柏爾舒 · 智能提詞</p>

<!-- 語言 -->
<div class="card">
  <div class="lbl">對方語言</div>
  <div class="lang-row">
    <button class="lang-btn on" onclick="setLang(this,'en-US','英語')">🇺🇸 英語</button>
    <button class="lang-btn" onclick="setLang(this,'ja-JP','日語')">🇯🇵 日語</button>
    <button class="lang-btn" onclick="setLang(this,'ko-KR','韓語')">🇰🇷 韓語</button>
    <button class="lang-btn" onclick="setLang(this,'fr-FR','法語')">🇫🇷 法語</button>
    <button class="lang-btn" onclick="setLang(this,'ar-SA','阿拉伯語')">🇸🇦 阿拉伯語</button>
    <button class="lang-btn" onclick="setLang(this,'de-DE','德語')">🇩🇪 德語</button>
  </div>
</div>

<!-- 背景 -->
<div class="card">
  <div class="lbl">商業背景</div>
  <textarea id="ctx">我是 PRAUS 柏爾舒的創辦人，正在進行品牌推廣與業務介紹。核心價值是積極正向、以人為本。回覆需自信、溫暖、專業。</textarea>
</div>

<!-- 設定 -->
<div class="card">
  <div class="speed-row">
    <label>🔊 播速</label>
    <input type="range" min="0.5" max="1.5" step="0.05" value="0.85" oninput="spd=parseFloat(this.value);document.getElementById('speedVal').textContent=this.value+'x'">
    <span id="speedVal">0.85x</span>
  </div>
  <div class="thresh-row">
    <label>🎯 跟讀門檻</label>
    <input type="range" min="50" max="95" step="5" value="75" oninput="threshold=parseInt(this.value);document.getElementById('threshVal').textContent=this.value+'%'">
    <span id="threshVal">75%</span>
  </div>
</div>

<!-- MIC -->
<div class="mic-wrap">
  <button id="micBtn"
    ontouchstart="startRec(event)" ontouchend="stopRec(event)"
    onmousedown="startRec(event)" onmouseup="stopRec(event)">🎤</button>
  <div id="micLabel">按住收聽對方說話</div>
</div>

<div id="statusBar">✅ 準備好了</div>

<!-- 對方說 -->
<div class="card">
  <div class="lbl">對方說的話</div>
  <div class="heard-txt" id="heard">等待收音...</div>
</div>

<!-- 回覆區 -->
<div class="card" id="replyCard">
  <div class="lbl">你的回覆 <span id="progressTxt"></span></div>
  <div id="sentList"></div>
</div>

<!-- 控制按鈕 -->
<div class="btn-row">
  <button class="btn btn-start" id="startBtn" disabled onclick="startReading()">▶ 開始播放</button>
  <button class="btn btn-skip" id="skipBtn" disabled onclick="skipSentence()">⏭ 跳過這句</button>
  <button class="btn btn-stop" id="stopBtn" disabled onclick="stopAll()">⏹ 停止</button>
</div>

<script>
const GROQ_KEY = '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';
const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';

let lang='en-US', langName='英語', spd=0.85, threshold=75;
let rec=null, isRec=false;
let sentences=[], currentIdx=0, isReading=false, isSpeaking=false;
let verifyRec=null, shouldStop=false;

function log(msg,col){ const e=document.getElementById('statusBar'); e.textContent=msg; e.style.color=col||'#f59e0b'; }

function setLang(btn,code,name){
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); lang=code; langName=name;
  log('語言：'+name,'#00e5ff');
}

// ── 收聽對方 ──
function startRec(e){
  e.preventDefault();
  if(isRec||isReading) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){log('請用Chrome','#ef4444');return;}
  rec=new SR(); rec.lang=lang; rec.continuous=false; rec.interimResults=true;
  rec.onstart=()=>{ isRec=true; document.getElementById('micBtn').classList.add('active'); document.getElementById('micLabel').textContent='聆聽中...'; log('🔴 收音中，放開送出','#ef4444'); };
  rec.onresult=(e)=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; const el=document.getElementById('heard'); el.textContent=t; el.classList.add('has'); };
  rec.onerror=(e)=>{ log('錯誤：'+e.error,'#ef4444'); resetMic(); };
  rec.onend=()=>{ const t=document.getElementById('heard').textContent; resetMic(); if(t&&t!=='等待收音...') callAI(t); };
  try{rec.start();}catch(e){log('無法啟動：'+e.message,'#ef4444');}
}

function stopRec(e){ e.preventDefault(); if(rec&&isRec){try{rec.stop();}catch(e){}} }

function resetMic(){
  isRec=false;
  document.getElementById('micBtn').classList.remove('active','verify','thinking');
  document.getElementById('micLabel').textContent='按住收聽對方說話';
}

// ── AI 生成 ──
async function callAI(heard){
  document.getElementById('micBtn').classList.add('thinking');
  document.getElementById('micLabel').textContent='AI 思考中...';
  document.getElementById('startBtn').disabled=true;
  document.getElementById('skipBtn').disabled=true;
  document.getElementById('stopBtn').disabled=true;
  log('⏳ 生成回覆...','#f59e0b');

  const ctx=document.getElementById('ctx').value;
  const prompt=`你是 PRAUS 柏爾舒創辦人的即時商務口語助理。
背景：${ctx}
對方說了一段${langName}，請代表創辦人生成自然、專業、溫暖的${langName}口語回覆。
把回覆分成3到5個短句，每句10到20個字，適合逐句朗讀跟讀。
只輸出JSON陣列：[{"en":"句子","zh":"中文意思"}]`;

  try{
    const res=await fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt+'\n\n對方說：'+heard}],temperature:0.7,max_tokens:500})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const raw=data.choices?.[0]?.message?.content||'';
    const clean=raw.replace(/```json|```/g,'').trim();
    sentences=JSON.parse(clean);
    renderSentences();
    document.getElementById('startBtn').disabled=false;
    document.getElementById('replyCard').style.display='block';
    log('✅ 回覆準備好了，按▶開始播放','#10b981');
    // 全自動直接開始
    setTimeout(startReading, 400);
  }catch(err){
    log('❌ '+err.message,'#ef4444');
  }
  resetMic();
}

function renderSentences(){
  const list=document.getElementById('sentList');
  list.innerHTML='';
  sentences.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sent-item pending'; d.id='sent-'+i;
    d.innerHTML=`<div class="sent-en">${s.en}</div><div class="sent-zh">${s.zh}</div><div class="sent-result" id="res-${i}"></div><div class="bar-wrap"><div class="bar" id="bar-${i}"></div></div>
